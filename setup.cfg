[flake8]
max-line-length = 100
extend-ignore =
    # Black handles line-break placement around binary operators.
    W503,
    W504,
    # Assigning a lambda is used deliberately for the no-op limiter fallback.
    E731
exclude =
    .git,
    .venv,
    __pycache__,
    migrations/versions,
    build,
    dist
per-file-ignores =
    # Schemas and blueprint modules re-export names for convenience.
    app/schemas/__init__.py:E402
    app/core/extensions.py:E402
    tests/conftest.py:E402
    # Content-Security-Policy directives are single unbreakable strings.
    app/core/config.py:E501
    # Seed catalogue rows read better on one line each.
    app/cli/commands.py:E501
