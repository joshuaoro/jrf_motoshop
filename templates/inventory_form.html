{% extends "base_new.html" %}
{% block page_type %}inventory{% endblock %}
{% block title %}Part Form - JRF System Panel{% endblock %}
{% block page_title %}{{ 'Edit Part: ' + part.name if part else 'Add New Part' }}{% endblock %}

{% block content %}
<div class="card p-8 max-w-4xl mx-auto">
    <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Part Name</label>
            <input type="text" name="name" required class="input-field w-full" value="{{ part.name or '' }}">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">SKU</label>
            <input type="text" name="sku" class="input-field w-full" value="{{ part.sku or '' }}">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Barcode</label>
            <input type="text" name="barcode" class="input-field w-full" value="{{ part.barcode or '' }}">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Part Type</label>
            <select name="part_type" class="input-field w-full">
                <option value="">Select type</option>
                {% for t in ['Engine', 'Brakes', 'Electrical', 'Body', 'Transmission', 'Suspension', 'Wheel', 'Other'] %}
                <option value="{{ t }}" {% if part and part.part_type == t %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Brand</label>
            <input type="text" name="brand" class="input-field w-full" value="{{ part.brand or '' }}">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Price</label>
            <input type="number" step="0.01" name="price" required class="input-field w-full" value="{{ part.price or '' }}">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Stock Quantity</label>
            <input type="number" name="stock_quantity" required class="input-field w-full" value="{{ part.stock_quantity or 0 }}">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Minimum Stock Level</label>
            <input type="number" name="min_stock_level" class="input-field w-full" value="{{ part.min_stock_level or 5 }}">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
            <textarea name="description" rows="3" class="input-field w-full">{{ part.description or '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
            <input type="text" name="location" class="input-field w-full" value="{{ part.location or '' }}">
        </div>
        <div>
            <label class="flex items-center mt-6">
                <input type="checkbox" name="is_active" value="true" {% if part and part.is_active %}checked{% endif %} class="w-4 h-4 text-blue-600">
                <span class="ml-2 text-sm text-gray-700">Active</span>
            </label>
        </div>
    </form>
    <div class="mt-8 flex justify-end space-x-4">
        <a href="{{ url_for('inventory.index') }}" class="btn-secondary">
            <i class="fas fa-times mr-2"></i>Cancel
        </a>
        <button type="submit" formaction="" class="btn-primary">
            <i class="fas fa-save mr-2"></i>Save Part
        </button>
    </div>
</div>
{% endblock %}
