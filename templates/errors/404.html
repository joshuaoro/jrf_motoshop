{% extends "base_new.html" %}
{% block title %}Page Not Found - JRF System{% endblock %}
{% block page_title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-16">
    <div class="text-center">
        <div class="text-9xl font-bold text-gray-200 mb-4">404</div>
        <h1 class="text-2xl font-semibold text-gray-800 mb-2">Page Not Found</h1>
        <p class="text-gray-500 mb-6">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('dashboard_web.index') }}" class="btn-primary inline-flex items-center">
            <i class="fas fa-home mr-2"></i>
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
