{% extends "base_new.html" %}

{% block title %}Notifications - JRF System{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Notifications</h1>
        <div class="flex space-x-3">
            {% if unread_notifications > 0 %}
            <button class="js-mark-all-read bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                <i class="fas fa-check-double mr-2"></i>Mark All Read
            </button>
            {% endif %}
            <button class="js-clear-all bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition-colors">
                <i class="fas fa-trash mr-2"></i>Clear All
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-lg shadow-md p-4 mb-6">
        <div class="flex flex-wrap gap-4">
            <div class="flex items-center space-x-2">
                <label for="filter-type" class="text-sm font-medium text-gray-700">Filter:</label>
                <select id="filter-type" class="px-3 py-1 border rounded-md text-sm">
                    <option value="all">All Notifications</option>
                    <option value="unread">Unread Only</option>
                    <option value="info">Info</option>
                    <option value="success">Success</option>
                    <option value="warning">Warning</option>
                    <option value="error">Error</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <label for="filter-category" class="text-sm font-medium text-gray-700">Category:</label>
                <select id="filter-category" class="px-3 py-1 border rounded-md text-sm">
                    <option value="all">All Categories</option>
                    <option value="system">System</option>
                    <option value="inventory">Inventory</option>
                    <option value="sales">Sales</option>
                    <option value="staff">Staff</option>
                    <option value="backup">Backup</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Notifications List -->
    <div id="notifications-container" class="bg-white rounded-lg shadow-md">
        <div id="notifications-list">
            <!-- Notifications will be loaded here -->
        </div>
        
        <!-- Loading indicator -->
        <div id="loading" class="p-8 text-center">
            <i class="fas fa-spinner fa-spin text-gray-400 text-2xl"></i>
            <p class="text-gray-500 mt-2">Loading notifications...</p>
        </div>
        
        <!-- Empty state -->
        <div id="empty-state" class="p-8 text-center hidden">
            <i class="fas fa-bell text-gray-300 text-4xl mb-3"></i>
            <p class="text-gray-500">No notifications found</p>
        </div>
        
        <!-- Pagination -->
        <div id="pagination" class="p-4 border-t border-gray-200 hidden">
            <div class="flex justify-between items-center">
                <span id="pagination-info" class="text-sm text-gray-600"></span>
                <div class="flex space-x-2">
                    <button id="prev-page" class="px-3 py-1 border rounded-md text-sm hover:bg-gray-50 disabled:opacity-50">
                        Previous
                    </button>
                    <button id="next-page" class="px-3 py-1 border rounded-md text-sm hover:bg-gray-50 disabled:opacity-50">
                        Next
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/pages/notifications.js') }}"></script>
{% endblock %}
