name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite runs against in-memory SQLite; these keep config validation
  # satisfied without any external service.
  FLASK_ENV: testing
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: black --check
        run: black --check --diff app wsgi.py tests

      - name: flake8
        run: flake8 app wsgi.py tests

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Browser tests are a separate job - they need a downloaded browser.
        run: pytest -q --ignore=tests/browser --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: pytest tests/browser -q

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: test-results/
          if-no-files-found: ignore

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jrf_ci
          POSTGRES_USER: jrf_ci
          POSTGRES_PASSWORD: jrf_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLASK_ENV: development
      DATABASE_URL: postgresql://jrf_ci:jrf_ci@localhost:5432/jrf_ci
      SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: flask --app wsgi db upgrade

      - name: Fail if the models have drifted from the migrations
        # `db migrate` writes a revision only when it finds a difference, so
        # a new file appearing here means someone changed a model without
        # generating the matching migration.
        run: |
          before=$(ls migrations/versions/*.py | wc -l)
          flask --app wsgi db migrate -m "drift-check" >/dev/null
          after=$(ls migrations/versions/*.py | wc -l)
          if [ "$after" -ne "$before" ]; then
            echo "::error::Models have drifted from migrations. Run: flask --app wsgi db migrate"
            git --no-pager diff --no-index /dev/null "$(ls -t migrations/versions/*.py | head -1)" || true
            exit 1
          fi
          echo "No drift."

      - name: Seed smoke test
        run: |
          flask --app wsgi init-db --admin-password ci-temporary-password
          flask --app wsgi seed-data
