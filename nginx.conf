# ============================================================
# JRF Motorcycle Parts - Nginx reverse proxy
#
# Mounted at /etc/nginx/nginx.conf, so this must be a COMPLETE config: the
# main context plus events{} and http{}. A fragment containing only
# server{}/upstream{} blocks is not valid here and nginx refuses to start.
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rid=$request_id rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Requests carry JSON and form posts only; keep the ceiling close to the
    # app's own MAX_CONTENT_LENGTH (8 MB).
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml application/json
               image/svg+xml;

    # Rate limiting. These sit in front of the app's own limiter and shed
    # abusive traffic before it costs a worker.
    limit_req_zone $binary_remote_addr zone=api:10m    rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;
    limit_req_status 429;

    # Only send "Connection: upgrade" for requests that actually ask for it.
    # Setting it unconditionally breaks keepalive on ordinary requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream app_backend {
        server app:5000;
        keepalive 32;
    }

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # gunicorn emits its own Server banner below the WSGI layer, where the
    # application cannot strip it. Drop it here so the stack is not advertised.
    proxy_hide_header Server;

    server {
        listen 80;
        server_name _;

        # Uncomment once TLS certificates are in place (see the https server
        # block below), to force every request onto HTTPS.
        # return 301 https://$host$request_uri;

        # Security headers are set by the application itself. They are not
        # repeated here - `add_header` in nginx would append a second copy of
        # each one rather than replacing it.

        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public" always;
            access_log off;
        }

        location = /health {
            proxy_pass http://app_backend;
            access_log off;
        }

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://app_backend;
        }

        location = /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://app_backend;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://app_backend;
        }

        location / {
            limit_req zone=general burst=100 nodelay;
            proxy_pass http://app_backend;
        }

        # The application renders its own error pages; only fall back to a
        # static message when the app itself is unreachable.
        error_page 502 503 504 /nginx_50x.html;
        location = /nginx_50x.html {
            internal;
            default_type text/html;
            return 503 '<!doctype html><meta charset="utf-8"><title>Service unavailable</title><body style="font-family:system-ui;text-align:center;padding:4rem"><h1>Service temporarily unavailable</h1><p>JRF Motorcycle Parts is starting up or under maintenance. Please try again shortly.</p></body>';
        }
    }

    # ------------------------------------------------------------
    # HTTPS. Put fullchain.pem and privkey.pem in ./ssl (mounted at
    # /etc/nginx/ssl) and uncomment.
    # ------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location /static/ {
    #         alias /var/www/static/;
    #         expires 30d;
    #         add_header Cache-Control "public" always;
    #         access_log off;
    #     }
    #
    #     location = /health          { proxy_pass http://app_backend; access_log off; }
    #     location = /api/auth/login  { limit_req zone=login burst=5 nodelay; proxy_pass http://app_backend; }
    #     location = /login           { limit_req zone=login burst=5 nodelay; proxy_pass http://app_backend; }
    #     location /api/              { limit_req zone=api burst=50 nodelay; proxy_pass http://app_backend; }
    #     location /                  { limit_req zone=general burst=100 nodelay; proxy_pass http://app_backend; }
    # }
}
